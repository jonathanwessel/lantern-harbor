<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A tap-and-idle lighthouse game. Guide ships, catch birds, fend off skuas, and light up new harbors.">
</head>
<body data-harbor="lantern">
<!-- Layout: the harbor fills the screen; a floating HUD on top, a dock of panels at the bottom
     (left edge on wide screens); panels open as a bottom sheet on phones and a side drawer on desktops. -->
<canvas id="cv" aria-label="Lighthouse harbor. Tap to shine the beam, guide ships and catch birds." role="button" tabindex="0"></canvas>

<header class="hud" id="hud">
  <div class="hud-row">
    <div class="wallet">
      <div class="chip light" title="Light"><span class="ic">☀</span><b id="coins">0</b></div>
      <div class="chip g" title="Gems"><span class="ic">◆</span><b id="gems">0</b></div>
      <div class="chip l" id="lchip" title="Lumens" hidden><span class="ic">✦</span><b id="lumens">0</b></div>
    </div>
    <button class="chip harbor-chip" data-chart aria-label="Open the sea chart"><span class="ic">⚓</span><b id="hname">Lantern Harbor</b><i class="dot" id="hdot" hidden></i></button>
  </div>
  <div class="stats"><span><b id="ptap">1</b> / tap</span><span><b id="psec">0</b> / s</span><span><b id="ships">0</b> ships</span><span class="cond" id="cond"></span></div>
  <div class="badges"><div class="badge boost" id="boost" hidden></div><div class="badge frenzy" id="frenzy" hidden></div><div class="badge combo" id="combo" hidden></div><div class="badge flares" id="flares" hidden></div><div class="badge" id="wx" hidden></div><div class="badge goldb" id="goldb" hidden>Golden ship! Tap it</div></div>
</header>

<div class="update" id="update" hidden>Version <b id="upd-v"></b> is ready <button class="buy glass" id="upd-go">Reload</button></div>
<div class="coach" id="coach" hidden><span id="coach-text"></span><button class="ghost sm" id="coach-skip">Skip tips</button></div>

<nav class="dock" id="dock" role="tablist" aria-label="Panels">
  <button class="tab" role="tab" data-tab="up" aria-selected="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6M6 20l6-6 6 6"/></svg><span>Upgrades</span></button>
  <button class="tab" role="tab" data-tab="research" aria-selected="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l11-6 2 4-11 6zM15 9l3-2 2 4-3 2M9 17l-2 4M11 16l2 5"/></svg><span>Research</span><i class="dot" id="resdot" hidden></i></button>
  <button class="tab" role="tab" data-tab="keepers" aria-selected="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6M8 5.5h8"/></svg><span>Keepers</span><i class="dot" id="kdot" hidden></i></button>
  <button class="tab" role="tab" data-tab="goals" aria-selected="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg><span>Goals</span><i class="dot" id="gdot" hidden></i></button>
  <button class="tab" role="tab" data-tab="relight" aria-selected="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-4 3-5 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg><span>Relight</span><i class="dot" id="rdot" hidden></i></button>
  <button class="tab" role="tab" data-tab="shop" aria-selected="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l4 5-9 11L3 9zM3 9h18M9 4l3 16 3-16"/></svg><span>Shop</span></button>
  <button class="tab" role="tab" data-tab="menu" aria-selected="false" aria-controls="sheet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
</nav>

<aside class="sheet" id="sheet" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head" id="sheet-head"><span class="grab" aria-hidden="true"></span><h2 id="sheet-title"></h2><button class="close" id="sheet-close" aria-label="Close panel">✕</button></div>
  <div class="sheet-body" id="sheet-body">
    <section id="p-up" class="list" hidden></section>
    <section id="p-research" hidden></section>
    <section id="p-keepers" hidden></section>
    <section id="p-goals" class="list" hidden></section>
    <section id="p-relight" hidden></section>
    <section id="p-shop" class="list" hidden></section>
    <section id="p-menu" hidden>
      <div class="menu">
        <button class="mitem" data-settings><b>Settings</b><small>Sound, vibration, motion, numbers</small></button>
        <button class="mitem" data-sound aria-pressed="true">Sound on</button>
        <button class="mitem" data-chart><b>Sea chart</b><small>Harbors and travel</small></button>
        <button class="mitem" data-export><b>Export save</b><small>Copy a code to move your game</small></button>
        <button class="mitem" data-import><b>Import save</b><small>Paste a code from another device</small></button>
        <button class="mitem" data-backups><b>Backups</b><small>Automatic snapshots of this save</small></button>
        <button class="mitem install" id="install" hidden><b>Install app</b><small>Home screen, full screen, offline</small></button>
      </div>
      <p class="about">Lantern Harbor <span id="ver"></span> · free to play · your progress is saved on this device.</p>
    </section>
  </div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title"></h2>
    <p id="m-body"></p>
    <textarea id="m-field" rows="4" spellcheck="false" hidden></textarea>
    <div class="actions"><button class="ghost" id="m-no">Cancel</button><button class="buy cash" id="m-yes">OK</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
